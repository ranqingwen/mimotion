name: 深度清理历史记录

on:
  workflow_dispatch: # 仅支持手动在 Actions 页面点击运行

jobs:
  clean-old-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read

    steps:
      # 1. 专门清理“刷步数” (run.yml)，只保留最近 10 次
      - name: 清理 刷步数 历史记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.PAT }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 10
          delete_workflow_pattern: "run.yml"

      # 2. 专门清理“Random Cron” (cron.yml)，只保留最近 10 次
      - name: 清理 Random Cron 历史记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.PAT }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 10
          delete_workflow_pattern: "cron.yml"
